name: Health check

# End-to-end read-only check against the live Yango Tech Retail B2B API. Auth is
# the Bearer token issued by Yango Tech, stored as a repo secret — no per-run
# minting. smoke makes NO writes (stores/get only). Runs daily + manual dispatch
# only (never on push/PR), so secrets aren't exposed to PRs/forks.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-yango-retail'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        run: npm run smoke
        env:
          YANGO_RETAIL_TOKEN: ${{ secrets.YANGO_RETAIL_TOKEN }}
